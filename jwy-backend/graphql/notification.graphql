type Notification {
    id: ID!
    user: User! @belongsTo
    titre: String!
    message: String!
    type: TypeNotification!
    priorite: String!
    est_lue: Boolean!
    lue_le: DateTime
    data: JSON
    action_url: String
    created_at: DateTime!
}

enum StatutUrgence {
    ACTIVE          @enum(value: "active")
    PRISE_EN_CHARGE @enum(value: "prise_en_charge")
    CLOTUREE        @enum(value: "cloturee")
    ANNULEE         @enum(value: "annulee")
}

"Alerte d'urgence individuelle (bouton SOS du patient)"
type AlerteUrgence {
    id: ID!
    patient: Patient! @belongsTo
    "Médecin qui a pris l'alerte en charge"
    medecin: Medecin @belongsTo
    type_urgence: String!
    description: String
    latitude: Float!
    longitude: Float!
    statut: StatutUrgence!
    prise_en_charge_le: DateTime
    cloturee_le: DateTime
    created_at: DateTime!
}

type AlerteSante {
    id: ID!
    type_alerte: String!
    zone: String!
    niveau_gravite: NiveauGravite!
    description: String!
    recommandations: String
    date_debut: DateTime!
    date_fin: DateTime
    est_active: Boolean!
    personnes_touchees: Int!
}

extend type Query {
    "Mes notifications"
    mesNotifications(
        est_lue: Boolean
        first: Int = 20
        page: Int
    ): NotificationPaginator! @guard
        @field(resolver: "App\\GraphQL\\Queries\\MesNotifications")

    "Alertes santé actives dans une zone"
    alertesSante(zone: String): [AlerteSante!]!
        @field(resolver: "App\\GraphQL\\Queries\\AlertesSante")

    "Mon alerte d'urgence en cours (patient)"
    monAlerteUrgence: AlerteUrgence @guard
        @field(resolver: "App\\GraphQL\\Queries\\MonAlerteUrgence")

    "Alertes d'urgence (médecin) : en cours, puis celles prises en charge par moi"
    alertesUrgence: [AlerteUrgence!]! @guard
        @field(resolver: "App\\GraphQL\\Queries\\AlertesUrgence")
}

type NotificationPaginator {
    data: [Notification!]!
    paginatorInfo: PaginatorInfo!
}

extend type Mutation {
    "Marquer une notification comme lue"
    marquerNotificationLue(id: ID!): Notification!
        @guard
        @field(resolver: "App\\GraphQL\\Mutations\\MarquerNotificationLue")

    "Marquer toutes les notifications comme lues"
    marquerToutesLues: Boolean! @guard
        @field(resolver: "App\\GraphQL\\Mutations\\MarquerToutesLues")

    "Déclencher une alerte d'urgence (patient)"
    declencherAlerteUrgence(
        latitude: Float! @rules(apply: ["between:-90,90"])
        longitude: Float! @rules(apply: ["between:-180,180"])
        type_urgence: String!
        description: String
    ): AlerteUrgence! @guard
        @field(resolver: "App\\GraphQL\\Mutations\\DeclencherAlerteUrgence")

    "Prendre en charge une alerte d'urgence (médecin)"
    prendreEnChargeUrgence(id: ID!): AlerteUrgence! @guard
        @field(resolver: "App\\GraphQL\\Mutations\\PrendreEnChargeUrgence")

    "Clôturer (médecin en charge) ou annuler (patient) une alerte d'urgence"
    terminerAlerteUrgence(id: ID!): AlerteUrgence! @guard
        @field(resolver: "App\\GraphQL\\Mutations\\TerminerAlerteUrgence")

    "Créer une alerte santé publique (admin)"
    creerAlerteSante(
        type_alerte: String!
        zone: String!
        niveau_gravite: NiveauGravite!
        description: String!
        recommandations: String
        date_debut: DateTime!
        date_fin: DateTime
    ): AlerteSante! @guard
        @field(resolver: "App\\GraphQL\\Mutations\\CreerAlerteSante")
}
