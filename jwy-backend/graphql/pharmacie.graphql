type Pharmacie {
    id: ID!
    nom_pharmacie: String!
    adresse: String!
    telephone: String
    latitude: Float!
    longitude: Float!
    heures_ouverture: JSON
    est_partenaire: Boolean!
    est_active: Boolean!
    livraison_disponible: Boolean!
    "Pharmacie de garde en ce moment"
    est_de_garde: Boolean!
    de_garde_jusqu_au: DateTime
    "Ouverte maintenant (horaires du jour, ou garde)"
    est_ouverte: Boolean!
    "Ex. : « Ouverte jusqu'à 20:00 », « De garde jusqu'au lundi 08:00 »"
    statut_ouverture: String!
    photo: String
    distance: Float
    pharmaciens: [Pharmacien!]! @belongsToMany
    stocks: [StockMedicament!]! @hasMany
}

type Pharmacien {
    id: ID!
    user: User! @belongsTo
    numero_ordre: String!
    nom: String!
    prenom: String!
    nom_complet: String!
    photo: String
    pharmacies: [Pharmacie!]! @belongsToMany
}

type StockMedicament {
    id: ID!
    pharmacie: Pharmacie! @belongsTo
    medicament: Medicament! @belongsTo
    quantite_disponible: Int!
    quantite_minimale: Int!
    date_expiration: String
    prix_vente: Float!
    is_stock_faible: Boolean!
}

type Medicament {
    id: ID!
    nom_commercial: String!
    principe_actif: String!
    dosage: String
    forme: FormeMedicament!
    fabricant: String
    prix_unitaire: Float!
    necessite_ordonnance: Boolean!
    description: String
    contre_indications: [String!]!
    effets_secondaires: [String!]!
    stocks: [StockMedicament!]! @hasMany
}

extend type Query {
    "Pharmacies proches par géolocalisation (rayon en km)"
    pharmaciesProches(
        latitude: Float!
        longitude: Float!
        rayon: Float = 10
        "Uniquement les pharmacies de garde"
        de_garde: Boolean = false
    ): [Pharmacie!]!
        @field(resolver: "App\\GraphQL\\Queries\\PharmaciesProches")

    "Détail d'une pharmacie (avec son stock)"
    pharmacie(id: ID! @eq): Pharmacie @find

    "Rechercher un médicament"
    rechercherMedicament(terme: String!): [Medicament!]!
        @field(resolver: "App\\GraphQL\\Queries\\RechercherMedicament")

    "Vérifier la disponibilité d'un médicament"
    disponibiliteMedicament(
        medicament_id: ID!
        latitude: Float
        longitude: Float
    ): [StockMedicament!]!
        @field(resolver: "App\\GraphQL\\Queries\\DisponibiliteMedicament")

    "Stock d'une pharmacie (pour le pharmacien connecté)"
    monStock(first: Int = 20, page: Int): StockPaginator! @guard
        @field(resolver: "App\\GraphQL\\Queries\\MonStock")
}

type StockPaginator {
    data: [StockMedicament!]!
    paginatorInfo: PaginatorInfo!
}

input CommandeInput {
    pharmacie_id: ID!
    prescription_id: ID
    type_livraison: TypeLivraison!
    adresse_livraison: String
    medicaments: [CommandeMedicamentInput!]!
}

input CommandeMedicamentInput {
    medicament_id: ID!
    quantite: Int!
}

type Commande {
    id: ID!
    patient: Patient! @belongsTo
    pharmacie: Pharmacie! @belongsTo
    prescription: Prescription @belongsTo
    numero_commande: String!
    statut: StatutCommande!
    type_livraison: TypeLivraison!
    adresse_livraison: String
    montant_total: Float!
    frais_livraison: Float!
    notes: String
    medicaments: [Medicament!]! @belongsToMany
    "Médicaments commandés avec quantité et prix"
    lignes: [LigneCommande!]! @field(resolver: "App\\GraphQL\\Fields\\LignesCommande")
    paiement: Paiement @morphOne
    created_at: DateTime!
}

type LigneCommande {
    medicament: Medicament!
    quantite: Int!
    prix_unitaire: Float!
}

type CommandePaginator {
    data: [Commande!]!
    paginatorInfo: PaginatorInfo!
}

extend type Query {
    "Pharmacie du pharmacien connecté"
    maPharmacie: Pharmacie @guard
        @field(resolver: "App\\GraphQL\\Queries\\MaPharmacie")

    "Commandes reçues par la pharmacie (pharmacien)"
    commandesPharmacie(statut: StatutCommande, first: Int = 20, page: Int): CommandePaginator! @guard
        @field(resolver: "App\\GraphQL\\Queries\\CommandesPharmacie")

    "Mes commandes (patient)"
    mesCommandes(first: Int = 20, page: Int): CommandePaginator! @guard
        @field(resolver: "App\\GraphQL\\Queries\\MesCommandes")
}

input UpdatePharmacienInput {
    nom: String @rules(apply: ["nullable", "filled"], messages: [{ rule: "filled", message: "Ce champ ne peut pas être vide." }])
    prenom: String @rules(apply: ["nullable", "filled"], messages: [{ rule: "filled", message: "Ce champ ne peut pas être vide." }])
}

input UpdatePharmacieInput {
    nom_pharmacie: String @rules(apply: ["nullable", "filled"], messages: [{ rule: "filled", message: "Ce champ ne peut pas être vide." }])
    adresse: String @rules(apply: ["nullable", "filled"], messages: [{ rule: "filled", message: "Ce champ ne peut pas être vide." }])
    telephone: String
    livraison_disponible: Boolean
    heures_ouverture: JSON
}

extend type Mutation {
    "Modifier son profil pharmacien"
    updateProfilPharmacien(input: UpdatePharmacienInput! @spread): Pharmacien!
        @guard
        @field(resolver: "App\\GraphQL\\Mutations\\UpdateProfilPharmacien")

    "Déclarer sa pharmacie de garde jusqu'à une date (null : fin de la garde)"
    declarerGarde(jusqu_au: DateTime): Pharmacie!
        @guard
        @field(resolver: "App\\GraphQL\\Mutations\\DeclarerGarde")

    "Modifier les informations de sa pharmacie"
    updateMaPharmacie(input: UpdatePharmacieInput! @spread): Pharmacie!
        @guard
        @field(resolver: "App\\GraphQL\\Mutations\\UpdateMaPharmacie")

    "Passer une commande de médicaments"
    commanderMedicaments(input: CommandeInput! @spread): Commande!
        @guard
        @field(resolver: "App\\GraphQL\\Mutations\\CommanderMedicaments")

    "Mettre à jour le stock (pharmacien)"
    updateStock(
        medicament_id: ID!
        quantite_disponible: Int! @rules(apply: ["integer", "min:0"], messages: [{ rule: "min", message: "La quantité ne peut pas être négative." }])
        prix_vente: Float @rules(apply: ["nullable", "numeric", "min:0"])
        quantite_minimale: Int @rules(apply: ["nullable", "integer", "min:0"])
        date_expiration: String
    ): StockMedicament!
        @guard
        @field(resolver: "App\\GraphQL\\Mutations\\UpdateStock")

    "Mettre à jour le statut d'une commande (pharmacien)"
    updateStatutCommande(id: ID!, statut: StatutCommande!): Commande!
        @guard
        @field(resolver: "App\\GraphQL\\Mutations\\UpdateStatutCommande")
}
